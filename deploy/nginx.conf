# ============================================================================
# Knetsec_Ai 管理面板 nginx 配置（Dockerfile.web 内置使用）
#
# 职责：
# 1. 托管 Vue3 打包后的静态文件，SPA 路由回退到 index.html；
# 2. 把 /api/ 反向代理到 server 容器（容器名 server:8787），保留 /api/v1 路径；
# 3. /health、/docs、/openapi.json 一并透传，便于直接从面板域名访问；
# 4. 安全响应头、gzip、长请求（报告生成/采集试采）超时 120s。
# ============================================================================

upstream knetsec_server {
    server server:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 管理接口请求体很小；限制上限避免异常大包
    client_max_body_size 2m;

    # 基础安全响应头（注意：location 内若再次 add_header 会覆盖父级，故统一定义在 server 级）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://knetsec_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 试采/报告生成可能较慢，给足读超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---------- 健康检查 / API 文档透传 ----------
    location = /health {
        proxy_pass http://knetsec_server/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /openapi.json {
        proxy_pass http://knetsec_server/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /docs {
        proxy_pass http://knetsec_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---------- 静态资源缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
